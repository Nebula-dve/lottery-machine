<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a31">
  <title>好运摇号机</title>
  <style>
    :root{color-scheme:dark;--bg:#101a31;--panel:#192743;--line:#ffffff1c;--muted:#97a5bd;--gold:#edbd70;--red:#e95350;--blue:#527bd6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f8f5ef;background:radial-gradient(ellipse at 50% -20%,#2a3c60,transparent 60%),var(--bg)}
    button,select{font:inherit}.shell{width:min(1120px,calc(100% - 32px));margin:auto}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.04em}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#ffdf9c,#dca451);color:#18233a;font-size:20px}.subbrand{display:block;margin-top:2px;color:var(--muted);font:10px system-ui;letter-spacing:.14em}.top-note{color:#b2bfd2;font-size:12px}
    main{padding:38px 0 48px}.intro{text-align:center;margin-bottom:28px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.2em}.intro h1{margin:11px 0 8px;font-size:clamp(27px,4vw,38px);letter-spacing:.04em}.intro p{margin:0;color:var(--muted);font-size:13px}
    .layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,.82fr);gap:17px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#1d2d4c,#16223b);box-shadow:0 20px 60px #07102038}.draw{padding:23px 25px;min-height:430px}.draw-head,.side-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.label{font-size:12px;color:#b5c0d0;font-weight:600}.select-wrap{position:relative}.select-wrap:after{content:'⌄';position:absolute;right:12px;top:7px;color:var(--gold);pointer-events:none}select{appearance:none;padding:9px 30px 9px 12px;min-width:180px;border:1px solid #ffffff25;border-radius:9px;color:#f4eee3;background:#17233d;font-size:12px;cursor:pointer}
    .machine{height:245px;display:grid;place-items:center;position:relative;overflow:hidden}.ring{position:absolute;width:215px;height:215px;border:1px solid #d9ad6a30;border-radius:50%;box-shadow:inset 0 0 50px #d6a75c0b,0 0 35px #d6a75c0a}.ring:before,.ring:after{content:"";position:absolute;inset:14px;border:1px solid #d9ad6a20;border-radius:50%}.ring:after{inset:-10px;border-style:dashed;opacity:.6}.balls{position:relative;z-index:1;width:min(540px,100%);display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:11px;padding:14px}
    .ball{width:clamp(39px,6vw,53px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;flex:0 0 auto;color:#8e3035;font:500 16px ui-monospace,monospace;background:radial-gradient(circle at 32% 25%,#fffefb,#f2e6d0 64%,#cfbaa1);border:1px solid #ffffff9c;box-shadow:inset -3px -5px 9px #aa81662c,inset 2px 3px 5px #fff,0 7px 16px #070c1842;transition:transform .2s}.ball.red{color:white;background:radial-gradient(circle at 32% 24%,#ff9990,#e95350 52%,#b82f37);border-color:#ffb0a58c;text-shadow:0 1px 2px #8a252a66}.ball.blue{color:#fff;background:radial-gradient(circle at 32% 24%,#a9c2ff,#5c83df 52%,#3156a4);border-color:#c2d4ff80;text-shadow:0 1px 2px #213d8066}.ball.empty{color:#758097;opacity:.48;background:radial-gradient(circle at 32% 25%,#d8deea,#8e9ab0);border-color:#ffffff1d;box-shadow:inset -3px -5px 10px #111c3555}.ball.pop{animation:pop .4s cubic-bezier(.18,.89,.32,1.28)}
    @keyframes pop{0%{transform:scale(.55) translateY(12px);opacity:.5}65%{transform:scale(1.13) translateY(-3px)}100%{transform:scale(1);opacity:1}}@keyframes shake{to{transform:translateY(5px) rotate(8deg)}}.spinning .ball.empty{animation:shake .3s ease-in-out infinite alternate}.spinning .ball.empty:nth-child(even){animation-delay:-.15s}
    .stage{min-height:22px;text-align:center;color:#aebbd0;font-size:11px;letter-spacing:.04em}.stage b{color:#ffd995}.actions{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:11px}.primary{height:45px;min-width:175px;padding:0 22px;border:0;border-radius:10px;color:#272033;background:linear-gradient(115deg,#f9d691,#e5ae5e);font-weight:700;letter-spacing:.06em;cursor:pointer;box-shadow:0 6px 21px #e0a34a35}.primary:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}.primary:disabled{opacity:.7;cursor:wait}.secondary{height:41px;padding:0 13px;border:1px solid #ffffff24;border-radius:9px;color:#a8b4c8;background:#ffffff08;cursor:pointer}.secondary:hover{color:white;border-color:#edbd7066}
    .side{display:flex;flex-direction:column;gap:15px}.side .card{padding:19px}.side-title{padding-bottom:13px;border-bottom:1px solid var(--line)}.side-title h2{margin:0;font-size:13px;letter-spacing:.04em}.clear{border:0;color:#8996aa;background:none;font-size:10px;cursor:pointer}.clear:hover{color:var(--gold)}.history{min-height:105px;max-height:205px;overflow:auto}.empty-history{height:102px;display:grid;place-content:center;text-align:center;color:#75839c;font-size:11px;line-height:1.7}.row{display:grid;grid-template-columns:28px 1fr;gap:7px;padding:11px 0;border-bottom:1px solid #ffffff0a}.row:last-child{border-bottom:0}.idx{color:#7f8da4;font:10px ui-monospace,monospace;padding-top:4px}.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{min-width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:#933f42;background:#f0e5d2;font:10px ui-monospace,monospace}.chip.red{color:#fff;background:linear-gradient(145deg,#f27970,#ba343b)}.chip.blue{color:#fff;background:linear-gradient(145deg,#7799ee,#345cae)}.when{grid-column:2;color:#718099;font:9px ui-monospace,monospace}
    .rules{flex:1}.rule-list{padding:13px 0 0;margin:0;list-style:none;display:grid;gap:9px}.rule-list li{position:relative;padding-left:14px;color:#aab7ca;font-size:11px;line-height:1.6}.rule-list li:before{content:"";position:absolute;left:1px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--gold)}.rule-list strong{color:#e9d4b1;font-weight:600}.note{margin-top:13px;padding:10px 11px;border:1px solid #8bc9a122;border-radius:9px;background:#8bc9a10a;color:#a5bea9;font-size:10px;line-height:1.55}.footer{display:flex;justify-content:space-between;gap:16px;margin-top:20px;color:#75839a;font-size:10px;line-height:1.6}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);padding:10px 16px;border:1px solid #ffffff20;border-radius:10px;background:#202d48;color:#f8e8c7;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}@media(max-width:760px){.shell{width:min(100% - 26px,560px)}main{padding:30px 0}.layout{grid-template-columns:1fr}.draw{padding:19px 15px;min-height:410px}.machine{height:235px}.ring{width:200px;height:200px}.balls{gap:8px}.ball{width:clamp(38px,11vw,48px)}.side{display:grid;grid-template-columns:1fr 1fr;gap:11px}.side .card{padding:15px}.history-card{grid-row:span 2}.history{max-height:250px}.footer{display:block}.top-note{max-width:160px;text-align:right;font-size:10px}}@media(max-width:440px){.side{grid-template-columns:1fr}.history-card{grid-row:auto}.history{max-height:150px}.select-wrap select{min-width:150px}.top{height:66px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><div class="brand"><span class="mark">✦</span><span>好运摇号机<small class="subbrand">LUCKY DRAW STUDIO</small></span></div><div class="top-note">公平 · 随机 · 公开可见</div></header>
    <main>
      <section class="intro"><div class="eyebrow">A LITTLE MOMENT OF LUCK</div><h1>每一次随机，都值得期待</h1><p>轻轻一点，让好运自然发生。</p></section>
      <div class="layout">
        <section class="card draw" id="drawCard" aria-label="摇号区域">
          <div class="draw-head"><span class="label">选择摇号玩法</span><div class="select-wrap"><select id="gameSelect" aria-label="选择摇号玩法"><option value="dlt">超级大乐透 · 前区 5 + 后区 2</option><option value="custom">自定义演示 · 6 蓝 + 1 红</option></select></div></div>
          <div class="machine"><div class="ring"></div><div class="balls" id="balls" aria-live="polite"></div></div>
          <div class="stage" id="stage">准备就绪，等待开启这一轮</div>
          <div class="actions"><button class="primary" id="drawButton" type="button">开始摇号</button><button class="secondary" id="resetButton" type="button">清空当前</button></div>
        </section>
        <aside class="side">
          <section class="card history-card"><div class="side-title"><h2>本机摇号记录</h2><button class="clear" id="clearHistory" type="button">清空记录</button></div><div class="history" id="history"></div></section>
          <section class="card rules"><div class="side-title"><h2>玩法说明</h2><span style="color:#8f9db4;font:10px ui-monospace">DRAW RULES</span></div><ul class="rule-list" id="rules"></ul><div class="note">号码由浏览器加密随机数生成，同一区不重复。记录仅保存在当前浏览器。</div></section>
        </aside>
      </div>
      <footer class="footer"><span>娱乐与活动抽奖用途 · 本页面不属于官方彩票发行或开奖系统</span><span>RANDOM DRAW / 01</span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      const games={
        dlt:{front:5,frontMax:35,back:2,backMax:12,frontName:'前区',backName:'后区',frontColor:'neutral',backColor:'blue'},
        custom:{front:6,frontMax:33,back:1,backMax:16,frontName:'蓝球',backName:'红球',frontColor:'blue',backColor:'red'}
      };
      const $=id=>document.getElementById(id),gameSelect=$('gameSelect'),ballsEl=$('balls'),stageEl=$('stage'),drawButton=$('drawButton'),historyEl=$('history'),rulesEl=$('rules'),drawCard=$('drawCard'),toastEl=$('toast');
      let busy=false,toastTimer,history=loadHistory();
      function loadHistory(){try{const data=JSON.parse(localStorage.getItem('lucky-draw-history-v1')||'[]');return Array.isArray(data)?data.slice(0,20):[]}catch{return[]}}
      function saveHistory(){try{localStorage.setItem('lucky-draw-history-v1',JSON.stringify(history.slice(0,20)))}catch{showToast('浏览器未能保存记录')}}
      const game=()=>games[gameSelect.value],fmt=n=>String(n).padStart(2,'0'),wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      function randomInt(max){const ceiling=Math.floor(0x100000000/max)*max,data=new Uint32Array(1);let value;do{crypto.getRandomValues(data);value=data[0]}while(value>=ceiling);return value%max}
      function sample(max,count){const pool=Array.from({length:max},(_,i)=>i+1);for(let i=0;i<count;i++){const j=i+randomInt(max-i);[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,count).sort((a,b)=>a-b)}
      function ball(text,color,empty=false,drawn=false){const el=document.createElement('span');el.className=`ball${color==='red'?' red':color==='blue'?' blue':''}${empty?' empty':''}${drawn?' pop':''}`;el.textContent=text;if(empty)el.setAttribute('aria-hidden','true');return el}
      function renderBalls(front=[],back=[]){const g=game();ballsEl.replaceChildren();for(let i=0;i<g.front;i++){const n=front[i];ballsEl.append(ball(n?fmt(n):'·',g.frontColor,!n,Boolean(n)))}const sep=document.createElement('span');sep.setAttribute('aria-hidden','true');sep.style.cssText='width:8px;height:1px;background:#d2b57b66;margin:0 2px';ballsEl.append(sep);for(let i=0;i<g.back;i++){const n=back[i];ballsEl.append(ball(n?fmt(n):'·',g.backColor,!n,Boolean(n)))}}
      function renderRules(){const g=game(),note=gameSelect.value==='custom'?'<li>自定义颜色演示；官方双色球规则为 6 红 + 1 蓝。</li>':'';rulesEl.innerHTML=`<li><strong>${g.frontName}</strong>：从 01–${fmt(g.frontMax)} 中摇出 ${g.front} 个号码。</li><li><strong>${g.backName}</strong>：从 01–${fmt(g.backMax)} 中摇出 ${g.back} 个号码。</li><li>同一区号码不重复，结果按从小到大排列。</li>${note}`}
      function renderHistory(){if(!history.length){historyEl.innerHTML='<div class="empty-history">还没有摇号记录<br>你的第一组幸运号码即将诞生</div>';return}historyEl.replaceChildren();history.slice(0,20).forEach((item,index)=>{const row=document.createElement('div');row.className='row';const idx=document.createElement('span');idx.className='idx';idx.textContent=`#${String(index+1).padStart(2,'0')}`;const chips=document.createElement('div');chips.className='chips';const reverse=item.game==='custom';item.front.forEach(n=>{const c=document.createElement('span');c.className=`chip${reverse?' blue':item.game==='ssq'?' red':''}`;c.textContent=fmt(n);chips.append(c)});item.back.forEach(n=>{const c=document.createElement('span');c.className=`chip${reverse?' red':' blue'}`;c.textContent=fmt(n);chips.append(c)});const when=document.createElement('span');when.className='when';const label=item.game==='dlt'?'大乐透':item.game==='custom'?'自定义 6蓝1红':'双色球';when.textContent=`${label} · ${new Date(item.at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}`;row.append(idx,chips,when);historyEl.append(row)})}
      function showToast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200)}
      async function draw(){if(busy)return;busy=true;drawButton.disabled=true;drawButton.textContent='摇号中…';drawCard.classList.add('spinning');const key=gameSelect.value,g=game(),front=sample(g.frontMax,g.front),back=sample(g.backMax,g.back);renderBalls();const gotFront=[],gotBack=[];for(let i=0;i<front.length;i++){stageEl.innerHTML=`正在摇出 <b>${g.frontName} ${i+1} / ${g.front}</b>`;await wait(520);gotFront.push(front[i]);renderBalls(gotFront,gotBack)}for(let i=0;i<back.length;i++){stageEl.innerHTML=`正在摇出 <b>${g.backName} ${i+1} / ${g.back}</b>`;await wait(520);gotBack.push(back[i]);renderBalls(gotFront,gotBack)}drawCard.classList.remove('spinning');stageEl.innerHTML='<b>本轮摇号完成</b> · 好运已就位';history.unshift({game:key,front,back,at:Date.now()});history=history.slice(0,20);saveHistory();renderHistory();drawButton.disabled=false;drawButton.textContent='再摇一次';busy=false}
      gameSelect.addEventListener('change',()=>{if(busy)return;renderRules();renderBalls();stageEl.textContent='玩法已切换，准备开始新一轮';drawButton.textContent='开始摇号'});drawButton.addEventListener('click',draw);$('resetButton').addEventListener('click',()=>{if(busy)return;renderBalls();stageEl.textContent='当前号码已清空，等待开启新一轮';drawButton.textContent='开始摇号'});$('clearHistory').addEventListener('click',()=>{if(!history.length){showToast('记录已经是空的');return}history=[];saveHistory();renderHistory();showToast('本机摇号记录已清空')});renderRules();renderBalls();renderHistory();
    })();
  </script>
</body>
</html>
